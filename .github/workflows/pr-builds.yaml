name: PR builds

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch: # Enable manual runs
    inputs:
      pr-number:
        required: false
        default: ""
        type: string

permissions:
  packages: write
  contents: read

jobs:
  commit-sha:
    runs-on: ubuntu-latest
    name: Get commit SHA
    outputs:
      build-version: ${{ steps.get-sha.outputs.short-sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .
      - name: Get short commit SHA
        id: get-sha
        run: echo "short-sha=$(git rev-parse --short=8 HEAD)" >> "$GITHUB_OUTPUT"

  build-all:
    uses: ymir-emu/Ymir/.github/workflows/build.yaml@main
    name: Build
    needs: [commit-sha]
    with:
      dev-build: true
      debug-symbols: true
      build-version: ${{ needs.commit-sha.outputs.build-version }}-pr-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr-number || 'manual' }}
