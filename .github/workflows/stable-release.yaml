name: Stable release

on:
  push:
    tags: ["v*"]

permissions:
  packages: write
  contents: read

jobs:
  parse-version:
    runs-on: ubuntu-latest
    name: Parse version
    outputs:
      build-version: ${{ steps.version.outputs.build }}
      prerelease-version: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Parse semver string
        id: version
        uses: booxmedialtd/ws-action-parse-semver@7784200024d6b3fc01253e617ec0168daf603de3 # v1.4.7
        with:
          input_string: '${{ github.ref_name }}'
          version_extractor_regex: '^v(.*)$'

  build-all:
    uses: ymir-emu/Ymir/.github/workflows/build.yaml@main
    name: Build
    needs: [parse-version]
    with:
      dev-build: false
      debug-symbols: false
      build-version: ${{ needs.parse-version.outputs.build-version }}
      prerelease-version: ${{ needs.parse-version.outputs.prerelease-version }}

  release:
    runs-on: ubuntu-latest
    name: Publish stable release
    if: github.ref_type == 'tag'
    needs: [build-all]

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Ymir artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ymir
          pattern: ymir-*
          merge-multiple: true

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} \
            --draft \
            --latest \
            --title "Ymir ${{ github.ref_name }}" \
            ymir/*

  trigger-screenshotter:
    uses: ymir-emu/Ymir/.github/workflows/screenshotter.yaml@main
    name: Trigger screenshotter job
    needs: [release]
    secrets:
      YMIR_SCREENSHOTTER_SECRET: ${{ secrets.YMIR_SCREENSHOTTER_SECRET }}
